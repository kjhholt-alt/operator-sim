<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#080b12"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1a2235" stroke-width="1"/>
    </pattern>
    <pattern id="grid-small" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#0d111c" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="vignette" x1="50%" y1="50%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" stop-opacity="0"/>
      <stop offset="100%" stop-color="#080b12" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid-small)" opacity="0.4"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Status bar / kicker -->
  <g transform="translate(80, 80)">
    <circle cx="6" cy="6" r="6" fill="#4ad8e6">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="11" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13" fill="#4ad8e6" letter-spacing="4">EARLY ACCESS · DEMO</text>
    <text x="320" y="11" font-family="ui-monospace, JetBrains Mono, monospace" font-size="11" fill="#4a5775" letter-spacing="2">v0.0.14-DAY14</text>
    <text x="980" y="11" font-family="ui-monospace, JetBrains Mono, monospace" font-size="11" fill="#4a5775" letter-spacing="2" text-anchor="end">DAVENPORT · QC</text>
  </g>

  <!-- Kicker -->
  <text x="80" y="170" font-family="ui-monospace, JetBrains Mono, monospace" font-size="16" fill="#ffffff" letter-spacing="6">OPERATOR SIM</text>

  <!-- Title -->
  <text x="80" y="290" font-family="IBM Plex Sans, ui-sans-serif, sans-serif" font-weight="700" font-size="92" fill="#ffffff" letter-spacing="-2">HOLD THE FLOOR.</text>

  <!-- Subtitle -->
  <text x="80" y="350" font-family="IBM Plex Sans, ui-sans-serif, sans-serif" font-size="22" fill="#6b7a96">A dispatch simulator on the city you live in.</text>

  <!-- Feature strip -->
  <g transform="translate(80, 410)">
    <text x="0" y="0" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13" fill="#4ad8e6" letter-spacing="3">FIRE</text>
    <text x="70" y="0" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13" fill="#4a5775">·</text>
    <text x="90" y="0" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13" fill="#4ad8e6" letter-spacing="3">EMS</text>
    <text x="155" y="0" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13" fill="#4a5775">·</text>
    <text x="175" y="0" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13" fill="#4ad8e6" letter-spacing="3">POLICE</text>
    <text x="276" y="0" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13" fill="#4a5775">·</text>
    <text x="296" y="0" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13" fill="#4ad8e6" letter-spacing="3">SWAT</text>
  </g>

  <!-- Right-side: schematic city slice -->
  <g transform="translate(720, 130)" stroke="#2b3a55" fill="none">
    <!-- Iso ground -->
    <polygon points="100,200 350,80 600,200 350,320" fill="#0d111c" stroke="#2b3a55" stroke-width="1.5"/>
    <!-- Road grid lines -->
    <line x1="180" y1="160" x2="430" y2="280" stroke="#2b3a55" stroke-width="1"/>
    <line x1="260" y1="120" x2="510" y2="240" stroke="#2b3a55" stroke-width="1"/>
    <line x1="180" y1="200" x2="430" y2="80" stroke="#2b3a55" stroke-width="1" opacity="0.6"/>
    <line x1="260" y1="240" x2="510" y2="120" stroke="#2b3a55" stroke-width="1" opacity="0.6"/>
    <!-- Incident pinpoints -->
    <circle cx="290" cy="160" r="6" fill="#4ad8e6" opacity="0.9"/>
    <circle cx="290" cy="160" r="14" fill="#4ad8e6" opacity="0.18"/>
    <circle cx="290" cy="160" r="22" fill="none" stroke="#4ad8e6" stroke-width="1" opacity="0.4"/>

    <circle cx="370" cy="220" r="6" fill="#f0b85a" opacity="0.9"/>
    <circle cx="370" cy="220" r="14" fill="#f0b85a" opacity="0.18"/>
    <circle cx="370" cy="220" r="22" fill="none" stroke="#f0b85a" stroke-width="1" opacity="0.4"/>

    <circle cx="440" cy="180" r="7" fill="#ec5b6b" opacity="1"/>
    <circle cx="440" cy="180" r="16" fill="#ec5b6b" opacity="0.2"/>
    <circle cx="440" cy="180" r="26" fill="none" stroke="#ec5b6b" stroke-width="1" opacity="0.5"/>

    <!-- Station markers -->
    <rect x="140" y="180" width="14" height="14" fill="#4ad8e6" opacity="0.7" transform="rotate(45 147 187)"/>
    <rect x="530" y="170" width="14" height="14" fill="#4ad8e6" opacity="0.7" transform="rotate(45 537 177)"/>
  </g>

  <!-- Bottom metadata strip -->
  <g transform="translate(0, 580)">
    <line x1="80" y1="0" x2="1120" y2="0" stroke="#1a2235" stroke-width="1"/>
    <text x="80" y="22" font-family="ui-monospace, JetBrains Mono, monospace" font-size="11" fill="#4a5775" letter-spacing="3">WEEKLY DEVLOG · SUN 17:00 CT</text>
    <text x="600" y="22" font-family="ui-monospace, JetBrains Mono, monospace" font-size="11" fill="#4a5775" letter-spacing="3" text-anchor="middle">SOLO BUILD · NO PUBLISHER</text>
    <text x="1120" y="22" font-family="ui-monospace, JetBrains Mono, monospace" font-size="11" fill="#4a5775" letter-spacing="3" text-anchor="end">STEAM EA · 2026-12-31</text>
  </g>
</svg>
