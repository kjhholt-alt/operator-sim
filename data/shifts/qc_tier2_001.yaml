id: qc_tier2_001
date: 2026-05-09
city: quad_cities
difficulty_tier: 2
length_game_min: 14
notes: |
  Tier 2 — denser pacing, multi-unit-heavy, first introduction of police
  agency calls. The roster (E1 engine, L1 ladder, M1 ambulance, P1 patrol)
  is just barely sufficient — the player will need to commit early on the
  cardiac and stage the structure-fire response with both fire units.

